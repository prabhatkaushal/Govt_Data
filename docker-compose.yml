version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nyayavault-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyayavault}
      POSTGRES_USER: ${POSTGRES_USER:-nyayavault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyayavault_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyayavault_user} -d ${POSTGRES_DB:-nyayavault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nyayavault-backend
    command: >
      sh -c "alembic upgrade head &&
             python seed_data.py || true &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nyayavault-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
