services:
  - type: web
    name: secura-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: python manage.py migrate && python manage.py seed_data
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secura-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: '*'
      - key: AI_MICROSERVICE_URL
        value: https://secura-ai.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'False'

  - type: web
    name: secura-frontend
    env: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://secura-backend.onrender.com/api
      - key: NEXT_PUBLIC_AI_URL
        value: https://secura-ai.onrender.com

  - type: web
    name: secura-ai
    env: docker
    region: oregon
    plan: free
    dockerContext: .
    dockerfilePath: ./ai_microservice/Dockerfile

databases:
  - name: secura-db
    databaseName: secura
    user: secura_user
    region: oregon
    plan: free
