services:
  # 1. Backend (Django)
  - type: web
    name: secura-backend
    env: docker
    region: oregon
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secura-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: '*'
      - key: DJANGO_SECRET_KEY
        generateValue: true

  # 2. Frontend (Next.js)
  - type: web
    name: secura-frontend
    env: docker
    region: oregon
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://secura-backend.onrender.com/api

  # 3. AI Microservice (FastAPI)
  - type: web
    name: secura-ai
    env: docker
    region: oregon
    dockerContext: .
    dockerfilePath: ./ai_microservice/Dockerfile

databases:
  # Managed PostgreSQL
  - name: secura-db
    databaseName: secura
    user: secura_user
    region: oregon
    plan: free
